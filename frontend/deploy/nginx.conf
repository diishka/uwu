map $http_upgrade $conn_up { default upgrade; '' close; }
server {
  listen 80; server_name uwu.uz www.uwu.uz;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://uwu.uz$request_uri; }
}
server {
  listen 443 ssl; http2 on; server_name uwu.uz;
  ssl_certificate /etc/letsencrypt/live/uwu.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/uwu.uz/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always;
  root /usr/share/nginx/html; index index.html;
  location /api/ { proxy_pass http://backend:8000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $conn_up;
    proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 3600s; client_max_body_size 4k; }
  location / { try_files $uri /index.html; }
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
}
