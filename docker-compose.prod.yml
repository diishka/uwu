services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: uwu, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: uwu }
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: always
  backend:
    build: ./backend
    environment: { DATABASE_URL: "postgresql+asyncpg://uwu:${POSTGRES_PASSWORD}@db:5432/uwu", CORS_ORIGINS: "https://uwu.uz", ANSWER_SALT: "${ANSWER_SALT}", APP_ENV: production }
    depends_on: [db]
    restart: always
  web:
    build: { context: ./frontend, dockerfile: Dockerfile.prod }
    ports: ["80:80", "443:443"]
    volumes: ["/etc/letsencrypt:/etc/letsencrypt:ro", "/var/www/certbot:/var/www/certbot:ro"]
    depends_on: [backend]
    restart: always
volumes: { pgdata: {} }
